# Sepsis Forecasting - TCN Configuration
# Temporal Convolutional Network with causal dilated convolutions
# Causal by design

# Data
data:
  raw_dir: data/raw
  seq_length: 24
  val_split: 0.15
  max_patients: null

# Model
model:
  type: tcn
  input_size: 120
  hidden_size: 128
  num_layers: 4
  kernel_size: 3
  dropout: 0.2
  attention_size: 64

# Training
training:
  batch_size: 256
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  gradient_clip: 1.0
  pos_weight: auto
  pos_weight_multiplier: 0.5
  mixed_precision: true
  num_workers: 0
  scheduler_patience: 5
  scheduler_factor: 0.5
  min_lr: 0.00001

# Output
output:
  model_dir: outputs/models
  log_dir: outputs/logs

# Reproducibility
seed: 42
device: auto
